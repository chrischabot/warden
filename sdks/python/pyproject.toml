[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentry-replica"
version = "0.0.0"
description = "Python SDK for sentry-replica. Captures exceptions and messages, builds envelopes, transports them to a relay endpoint."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "UNLICENSED" }
authors = [{ name = "iGent AI" }]

# stdlib-only runtime — no httpx/requests.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["sentry_replica"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]